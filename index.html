<style>
:root{
  --bg:#ECEEF1;--surface:#FFFFFF;--field:#F3F5F7;--ink:#18202C;--muted:#5D6776;--line:#D6DBE2;
  --push:#C8322B;--pull:#2458A6;--legs:#D9A413;--core:#2E8B57;--cardio:#16808F;--rest:#9AA3B0;--good:#23804D;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11151B;--surface:#1A2029;--field:#222A35;--ink:#E7EBF0;--muted:#98A2B1;--line:#2D3542;
    --push:#E3574F;--pull:#5B8CDD;--legs:#E9BE3C;--core:#4DB07A;--cardio:#38B2C2;--rest:#6C7684;--good:#4DB07A;
  }
}
:root[data-theme="dark"]{
  --bg:#11151B;--surface:#1A2029;--field:#222A35;--ink:#E7EBF0;--muted:#98A2B1;--line:#2D3542;
  --push:#E3574F;--pull:#5B8CDD;--legs:#E9BE3C;--core:#4DB07A;--cardio:#38B2C2;--rest:#6C7684;--good:#4DB07A;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pull);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 120px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{font:800 22px/1 var(--display);letter-spacing:.01em}
.tabs{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs button{border:0;background:none;padding:7px 16px;border-radius:999px;font-weight:600;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* the week of plates */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.plate{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--muted);font-weight:600;font-size:13px}
.disc{width:100%;max-width:52px;aspect-ratio:1;border-radius:50%;position:relative;
  background:var(--c);box-shadow:inset 0 0 0 3px rgba(0,0,0,.14);transition:transform .18s ease}
.disc::after{content:"";position:absolute;inset:39%;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 2px rgba(0,0,0,.18)}
.disc.split{background:conic-gradient(var(--legs) 0 50%,var(--core) 50% 100%)}
.disc.rest{background:transparent;box-shadow:inset 0 0 0 3px var(--rest)}
.plate[aria-pressed="true"]{color:var(--ink)}
.plate[aria-pressed="true"] .disc{transform:scale(1.14)}
.plate .logged{width:5px;height:5px;border-radius:50%;background:var(--ink);opacity:0}
.plate .logged.on{opacity:1}

.hero{padding:18px 0 14px}
.hero h1{margin:0;font:800 clamp(64px,19vw,112px)/.86 var(--display);letter-spacing:-.01em;color:var(--dc)}
.hero .focus{margin:10px 0 0;font-size:18px;font-weight:600}
.hero .note{margin:4px 0 0;color:var(--muted);max-width:52ch}

.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 22px}
.meta input[type=date]{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600}
.chip.warn{border-color:var(--legs)}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px}
.switch input{accent-color:var(--pull);width:16px;height:16px;margin:0}

/* exercise blocks */
.ex{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--dc);border-radius:6px 14px 14px 6px;padding:14px 14px 10px;margin-bottom:14px}
.ex-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ex h2{margin:0;font:700 21px/1.15 var(--display)}
.target{font:700 18px/1 var(--display);white-space:nowrap;color:var(--muted)}
.last{margin:6px 0 0;font-size:14px;color:var(--muted)}
.hint{margin:6px 0 0;font-size:14px;font-weight:600}
.hint.up{color:var(--good)}
.sets{width:100%;border-collapse:collapse;margin-top:10px}
.sets th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:0 4px 4px}
.sets td{padding:4px}
.sets td:first-child{width:34px;font:700 18px var(--display);color:var(--muted);text-align:center}
.sets input{width:100%;min-width:0;background:var(--field);border:1px solid transparent;border-radius:10px;padding:10px;font-size:17px;font-variant-numeric:tabular-nums}
.sets input:focus{border-color:var(--dc);outline:none}
.sets input::placeholder{color:var(--muted);opacity:.55}
.sets td.ok{width:52px}
.done{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:none;display:grid;place-items:center}
.done svg{width:20px;height:20px;stroke:var(--muted);opacity:.5}
.done[aria-pressed="true"]{background:var(--dc);border-color:var(--dc)}
.done[aria-pressed="true"] svg{stroke:#fff;opacity:1}
.beat{font-size:12px;font-weight:700;color:var(--good);white-space:nowrap}
tr.isdone input{opacity:.7}

.restday{background:var(--surface);border:1px dashed var(--rest);border-radius:14px;padding:20px;color:var(--muted)}
.status{font-size:13px;color:var(--muted);text-align:center;margin-top:8px;min-height:1.4em}

/* history */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.panel h2{margin:0 0 10px;font:700 24px/1.1 var(--display)}
.panel select{width:100%;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px}
.chart{margin-top:12px;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto}
.hlist{list-style:none;margin:10px 0 0;padding:0}
.hlist li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.hlist li span:last-child{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.sess{width:100%;display:flex;align-items:center;gap:12px;border:0;border-top:1px solid var(--line);background:none;padding:10px 0;text-align:left}
.sess .dot{width:14px;height:14px;border-radius:50%;flex:none;background:var(--c)}
.sess .dot.split{background:conic-gradient(var(--legs) 0 50%,var(--core) 50% 100%)}
.sess b{font-weight:600}
.sess small{margin-left:auto;color:var(--muted);font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--field);border-radius:10px;padding:9px 14px;font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--field);padding:9px 16px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.filters button{border:1px solid var(--line);background:var(--field);border-radius:999px;padding:7px 14px;font-weight:600;color:var(--muted);white-space:nowrap}
.filters button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.filters .n{opacity:.65;font-weight:500;margin-left:2px}
.muted{color:var(--muted)}
.rules{margin:0;padding-left:20px;color:var(--muted);font-size:15px}
.rules li{margin:4px 0}

/* rest timer */
.timer{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);display:flex;align-items:center;gap:12px;transform:translateY(110%);transition:transform .22s ease}
.timer.on{transform:none}
.timer .t{font:800 30px/1 var(--display);font-variant-numeric:tabular-nums;min-width:74px}
.timer .bar{flex:1;height:6px;background:rgba(127,127,127,.35);border-radius:3px;overflow:hidden}
.timer .bar i{display:block;height:100%;background:var(--legs);width:100%}
.timer button{border:1px solid rgba(127,127,127,.5);background:none;color:inherit;border-radius:8px;padding:6px 10px;font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<style>

function iso(d){const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)}

function parseISO(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function dayOf(s){const g=parseISO(s).getDay();return g===0?7:g}
function fmtDate(s){return s?parseISO(s).toLocaleDateString(undefined,{day:"numeric",month:"short"}):""}
function mondayOf(s){const d=parseISO(s);const g=d.getDay();d.setDate(d.getDate()-(g===0?6:g-1));return iso(d)}

function allPlans(){return [...BUILTIN,...Object.entries(S.plans).map(([id,p])=>({id,...p})).sort((a,b)=>a.name.localeCompare(b.name))]}
function getPlan(id){return BUILTIN.find(p=>p.id===id)||(S.plans[id]?{id,...S.plans[id]}:null)}
function activePlan(){return getPlan(S.settings.activePlan)||BUILTIN[0]}
function sid(date,day,planId){return planId==="ppl"?date+"_d"+day:date+"_d"+day+"_"+planId}

/* ---------- rolling schedule ----------
   Workouts run in plan order. A workout day that passes with nothing logged keeps its
   workout for the next training day, and everything after it shifts along. Rest days
   never move and never receive a workout. Only the active plan rolls. */
function wslots(plan){return plan.days.map((d,i)=>d.t==="rest"?0:i+1).filter(Boolean)}
function alignedP(plan,date){const W=wslots(plan);const wd=dayOf(date);const k=W.findIndex(x=>x>=wd);return k<0?0:k}
function ensureAnchor(){
  const a=S.settings.sched;
  if(!a||a.planId!==S.settings.activePlan){
    S.settings.sched={planId:S.settings.activePlan,date:mondayOf(today()),p:0};
    saveSettings();
  }
}
function resetSchedule(){
  const plan=activePlan();
  S.settings.sched={planId:plan.id,date:today(),p:alignedP(plan,today())};
  saveSettings();
}
function sessSrc(s){return s.src||s.day}
function schedule(plan,until){
  const W=wslots(plan);const res={};
  const a=S.settings.sched;
  if(!W.length||!a||a.planId!==plan.id||until<a.date)return res;
  let p=(a.p||0)%W.length;const td=today();
  for(let d=a.date;d<=until;d=addDays(d,1)){
    const wd=dayOf(d);const tpl=plan.days[wd-1];const s=S.sessions[sid(d,wd,plan.id)];
    if(s&&hasSets(s)){
      const src=sessSrc(s);res[d]={src,st:"done"};
      const k=W.indexOf(src);p=((k<0?p:k)+1)%W.length;continue;
    }
    if(tpl.t==="rest"){res[d]={src:wd,st:"rest"};continue}
    const src=W[p];
    if(d<td)res[d]={src,st:"missed"};
    else{res[d]={src,st:d===td?"due":"planned"};p=(p+1)%W.length}
  }
  return res;
}
/* which template day (1-7) a date shows for a plan */
function srcFor(plan,date){
  const s=S.sessions[sid(date,dayOf(date),plan.id)];
  if(s&&hasSets(s))return sessSrc(s);
  if(plan.id===S.settings.activePlan){const r=schedule(plan,date)[date];if(r)return r.src}
  return dayOf(date);
}
function statusFor(plan,date){
  if(plan.id!==S.settings.activePlan)return null;
  return schedule(plan,date)[date]||null;
}
/* the day being shown: from its plan, or rebuilt from the session if that plan was deleted */
function day(){
  const p=viewPlan();
  if(p)return p.days[srcFor(p,S.date)-1];
  const s=cur();
  if(s)return {t:s.t||"other",title:s.title||"Workout",focus:"",note:"This plan was deleted. Showing what you logged.",
    ex:Object.keys(s.entries||{}).map(n=>X(n,Math.max(1,(s.entries[n]||[]).length),0,0))};
  return REST();
}
function sessionMeta(s){
  const p=getPlan(s.planId||"ppl");const d=p&&p.days[sessSrc(s)-1];
  return {t:s.t||(d&&d.t)||"other",title:s.title||(d&&d.title)||"Workout"};
}
function planSummary(p){
  const w=p.days.filter(d=>d.t!=="rest");
  return w.length+" workout"+(w.length===1?"":"s")+" a week"+(w.length?": "+[...new Set(w.map(d=>d.title))].join(", "):"");
}

/* ---------- shared progress summary ---------- */
function filled(sets){return (sets||[]).filter(x=>x&&x.r!=null)}
function hasSets(s){return Object.values(s.entries||{}).some(a=>filled(a).length)}
function monthOf(s){return s.slice(0,8)+"01"}
function volKg(s){const u=s.unit||"kg";let v=0;Object.values(s.entries||{}).forEach(a=>filled(a).forEach(x=>v+=(toKg(x.w,u)||0)*(x.r||0)));return v}
/* Counts for the leaderboard and buddies: this week, this month, streak and total.
   list: sessions with sets, oldest first. Volume is in kg. */
function tally(list){
  const td=today(),wk=mondayOf(td),mo=monthOf(td);
  const weeks=new Set(list.map(s=>mondayOf(s.date)));
  let streak=0,w=weeks.has(wk)?wk:addDays(wk,-7);
  while(weeks.has(w)){streak++;w=addDays(w,-7)}
  const wDays=new Set(),mDates=new Set();let volumeWeek=0,volumeMonth=0;
  list.forEach(s=>{
    const inW=mondayOf(s.date)===wk,inM=monthOf(s.date)===mo;
    if(!inW&&!inM)return;
    const v=volKg(s);
    if(inW){volumeWeek+=v;wDays.add(s.day)}
    if(inM){volumeMonth+=v;mDates.add(s.date)}
  });
  return {weekStart:wk,weekDays:[...wDays],volumeWeek:Math.round(volumeWeek),monthStart:mo,monthWorkouts:mDates.size,volumeMonth:Math.round(volumeMonth),
    streak,total:list.length,lastDate:list.length?list[list.length-1].date:null};
}
function computeSummary(){
  const list=Object.values(S.sessions).filter(s=>s.date&&hasSets(s)).sort((a,b)=>a.date<b.date?-1:1);
  const wk=mondayOf(today());
  const weekTypes={};
  list.filter(s=>mondayOf(s.date)===wk).forEach(s=>{weekTypes[String(s.day)]=sessionMeta(s).t});
  const lifts={};
  list.forEach(s=>{
    const u=s.unit||"kg";
    Object.entries(s.entries||{}).forEach(([name,arr])=>{
      const f=filled(arr);if(!f.length)return;
      let top=null;
      f.forEach(x=>{
        const kg=toKg(x.w,u)||0;
        if(!top||kg>top.w||(kg===top.w&&x.r>top.r))top={d:s.date,w:Math.round(kg*10)/10,r:x.r};
      });
      (lifts[name]||(lifts[name]=[])).push(top);
    });
  });
  const liftArr=Object.entries(lifts).map(([n,h])=>{
    let pr=h[0];h.forEach(x=>{if(x.w>pr.w||(x.w===pr.w&&x.r>pr.r))pr=x});
    return {n,pr,h:h.slice(-24)};
  });
  const recent=list.slice(-6).reverse().map(s=>{let c=0;Object.values(s.entries||{}).forEach(a=>c+=filled(a).length);const m=sessionMeta(s);return {d:s.date,day:s.day,t:m.t,title:m.title,sets:c}});
  return {sharing:true,name:myName(),photo:myPhoto(),ig:ME.ig,planName:activePlan().name,...tally(list),weekDays:Object.keys(weekTypes).map(Number),weekTypes,
    lifts:liftArr,recent,updated:Date.now()};
}

/* ---------- global leaderboard card ----------
   board/{uid} is a small public card with only the numbers the global leaderboard ranks by.
   Period fields carry their week or month in the name (ww_20260921, vm_202609, lw_20260921_bench),
   so each ranking is one orderBy on a single field: no composite indexes, and last week's
   numbers simply aren't found by this week's query. The streak is keyed by the last week
   trained, which keeps it valid through the following week. */
const GL_LIFTS=[["bench","Bench Press"],["squat","Squat"],["dead","Deadlift or Rack Pull"],["ohp","Overhead Press"]];
const BRD_KEY="infinity-brd-";
function wkKey(d){return mondayOf(d).replace(/-/g,"")}
function moKey(d){return d.slice(0,7).replace("-","")}
function weekBest(lf,wk){let b=0;(lf&&lf.h||[]).forEach(x=>{if(x.d>=wk&&x.w>b)b=x.w});return b}
function globalOn(){return S.mode==="db"&&S.settings.sharing&&S.settings.global!==false}
async function publishBoard(sum){
  if(S.mode!=="db"||!uid)return;
  const ref=doc(fs,"board",uid);
  let prev=null;try{prev=localStorage.getItem(BRD_KEY+uid)}catch(e){}
  if(!sum||S.settings.global===false){
    if(prev==="off")return;
    return deleteDoc(ref).then(()=>{try{localStorage.setItem(BRD_KEY+uid,"off")}catch(e){}}).catch(e=>console.warn("board",e));
  }
  const td=today(),wk=mondayOf(td),w=wkKey(td),mo=moKey(td);
  const data={name:(pname({nick:ME.nick,name:myName()})||"").slice(0,80),photo:await thumbOf(myPhoto()),total:sum.total||0};
  if(sum.weekDays.length)data["ww_"+w]=sum.weekDays.length;
  if(sum.volumeWeek)data["vw_"+w]=sum.volumeWeek;
  if(sum.monthWorkouts)data["mw_"+mo]=sum.monthWorkouts;
  if(sum.volumeMonth)data["vm_"+mo]=sum.volumeMonth;
  if(sum.streak)data["st_"+wkKey(sum.weekDays.length?td:addDays(wk,-7))]=sum.streak;
  GL_LIFTS.forEach(([k,n])=>{
    const lf=(sum.lifts||[]).find(x=>x.n===n);if(!lf)return;
    if(lf.pr.w>0)data["lp_"+k]=lf.pr.w;
    const b=weekBest(lf,wk);if(b>0)data["lw_"+w+"_"+k]=b;
  });
  const key=JSON.stringify(data);
  if(prev===key)return;
  return setDoc(ref,data).then(()=>{try{localStorage.setItem(BRD_KEY+uid,key)}catch(e){}}).catch(e=>console.warn("board",e));
}
/* global rankings, one query per field, cached for a few minutes. Entry: {rows, at} or {loading} or {err} */
const GLOB={};
function globRows(field,n){
  const c=GLOB[field+"|"+n];
  if(c&&(c.loading||Date.now()-c.at<180000))return c;
  const big=Object.keys(GLOB).find(k=>k.startsWith(field+"|")&&+k.split("|")[1]>=n&&GLOB[k].rows&&Date.now()-GLOB[k].at<180000);
  if(big)return {rows:GLOB[big].rows.slice(0,n),at:GLOB[big].at};
  const e=GLOB[field+"|"+n]={loading:true,rows:c&&c.rows};
  getDocs(query(collection(fs,"board"),orderBy(field,"desc"),limit(n)))
    .then(s=>{GLOB[field+"|"+n]={rows:s.docs.map(d=>{const v=d.data();return {uid:d.id,isMe:d.id===uid,p:{name:v.name||"Member",photo:v.photo||""},v:v[field]||0}}),at:Date.now()}})
    .catch(err=>{console.warn("global",err);GLOB[field+"|"+n]={err:fbError(err,"load the global leaderboard"),at:Date.now()}})
    .finally(()=>softRender());
  return e;
}
/* streaks live in two fields (this week and last week); merge them */
function globStreak(n){
  const wk=mondayOf(today()),a=globRows("st_"+wkKey(wk),n),b=globRows("st_"+wkKey(addDays(wk,-7)),n);
  if(a.err||b.err)return {err:a.err||b.err};
  const rows=[...(a.rows||[]),...(b.rows||[])].sort((x,y)=>y.v-x.v).slice(0,n);
  return {rows,loading:!!(a.loading||b.loading)&&!rows.length};
}
function globField(m,p,lift){
  const td=today(),w=wkKey(td),mo=moKey(td);
  if(m==="lifts")return p==="all"?"lp_"+lift:"lw_"+w+"_"+lift;
  if(m==="volume")return p==="month"?"vm_"+mo:"vw_"+w;
  return p==="all"?"total":p==="month"?"mw_"+mo:"ww_"+w;
}
function globalRanking(m,p,lift,n){return m==="streak"?globStreak(n):globRows(globField(m,p,lift),n)}
/* Zero out a summary's week or month once it's out of date. Summaries from older
   versions have no month fields, so their month counts read as zero. */
function live(sum){
  if(!sum)return null;
  const td=today(),wk=mondayOf(td);
  let L=sum;
  if(sum.weekStart!==wk)L={...L,weekDays:[],weekTypes:{},volumeWeek:0,streak:sum.weekStart===addDays(wk,-7)?sum.streak:0};
  if(sum.monthStart!==monthOf(td))L={...L,monthWorkouts:0,volumeMonth:0};
  return L;
}

/* shrink a picked photo so it fits in the profile document */
function readPhoto(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const S2=256,c=document.createElement("canvas");c.width=c.height=S2;
        const side=Math.min(img.width,img.height);
        c.getContext("2d").drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,S2,S2);
        let q=0.85,url=c.toDataURL("image/jpeg",q);
        while(url.length>200000&&q>0.4){q-=0.15;url=c.toDataURL("image/jpeg",q)}
        res(url);
      };
      img.onerror=()=>rej(new Error("image"));img.src=fr.result;
    };
    fr.onerror=()=>rej(new Error("read"));fr.readAsDataURL(file);
  });
}

function startSocial(){
  const rq=collection(fs,"requests");
  let fromMe=[],toMe=[];
  const recompute=()=>{
    SOC.outgoing=fromMe.filter(r=>r.status==="pending");
    SOC.incoming=toMe.filter(r=>r.status==="pending");
    SOC.accepted=[...fromMe,...toMe].filter(r=>r.status==="accepted").map(r=>({id:r.id,uid:r.from===uid?r.to:r.from}));
    [...SOC.accepted.map(a=>a.uid),...SOC.incoming.map(r=>r.from),...SOC.outgoing.map(r=>r.to)].forEach(loadProfile);
    const bset=new Set(SOC.accepted.map(a=>a.uid));
    bset.forEach(b=>{if(!SOC.buddyUnsubs[b])watchBuddy(b,recompute)});
    Object.keys(SOC.buddyUnsubs).forEach(b=>{if(!bset.has(b)){SOC.buddyUnsubs[b]();delete SOC.buddyUnsubs[b];delete SOC.shared[b]}});
    softRender();
  };
  SOC.unsubs.push(onSnapshot(query(rq,where("from","==",uid)),s=>{fromMe=s.docs.map(d=>({id:d.id,...d.data()}));recompute()},e=>console.warn(e)));
  SOC.unsubs.push(onSnapshot(query(rq,where("to","==",uid)),s=>{toMe=s.docs.map(d=>({id:d.id,...d.data()}));recompute()},e=>console.warn(e)));
  /* who I let train me */
  SOC.unsubs.push(onSnapshot(doc(fs,"coaching",uid),d=>{SOC.trainers=(d.exists()&&d.data().trainers)||[];SOC.trainers.forEach(loadProfile);softRender()},e=>console.warn(e)));
  /* who I train */
  SOC.unsubs.push(onSnapshot(query(collection(fs,"coaching"),where("trainers","array-contains",uid)),
    s=>{SOC.trainees=s.docs.map(d=>d.id);SOC.trainees.forEach(loadProfile);softRender()},e=>console.warn(e)));
}
function watchBuddy(b,recompute){
  SOC.buddyUnsubs[b]=onSnapshot(doc(fs,"shared",b),snap=>{
    SOC.shared[b]=snap.exists()?snap.data():{sharing:false};SOC.retries[b]=0;softRender();
  },()=>{
    delete SOC.buddyUnsubs[b];
    SOC.retries[b]=(SOC.retries[b]||0)+1;
    if(SOC.retries[b]<=4)setTimeout(recompute,3000*SOC.retries[b]);
  });
}
function say(t,ok){S.msg=t;S.msgOk=!!ok;softRender(true)}
async function sendRequest(to){
  if(to===uid)return say("That's your own account.");
  if(SOC.accepted.some(a=>a.uid===to))return say("You're already buddies.");
  if(SOC.outgoing.some(r=>r.to===to))return say("Request already sent. Waiting for them to accept.");
  const inc=SOC.incoming.find(r=>r.from===to);
  if(inc)return accept(inc.id);
  try{await setDoc(doc(fs,"requests",uid+"_"+to),{from:uid,to,status:"pending",created:serverTimestamp()});say("Buddy request sent.",true)}
  catch(e){say("Couldn't send the request. Try again.")}
}
async function addByEmail(email){
  const e=email.trim().toLowerCase();
  if(!e)return say("Enter your buddy's Google email.");
  try{
    const d=await getDoc(doc(fs,"emails",e));
    if(!d.exists())return say("No one with that email has signed in yet. Send them your invite link instead.");
    await sendRequest(d.data().uid);

function accept(id){return updateDoc(doc(fs,"requests",id),{status:"accepted"}).then(()=>say("You're now buddies.",true)).catch(()=>say("Couldn't accept. Try again."))}
function removeReq(id,okMsg){return deleteDoc(doc(fs,"requests",id)).then(()=>okMsg&&say(okMsg,true)).catch(()=>say("That didn't go through. Try again."))}
function fbError(e,what){
  const c=e&&e.code||"";
  if(c==="permission-denied")return "Firestore refused that ("+what+"). Publish the latest firestore.rules in the Firebase console, then try again.";
  if(c==="unavailable")return "No connection. That will go through once you're back online.";
  return "Couldn't "+what+". "+(c?"("+c+")":"Try again.");
}

/* ---------- workout logic ---------- */
function ensure(){
  const id=curId();
  const p=viewPlan();
  if(!S.sessions[id]){const d=day();S.sessions[id]={date:S.date,day:S.day,src:p?srcFor(p,S.date):S.day,planId:S.planId,t:d.t,title:d.title,unit:S.settings.unit,deload:false,entries:{},updated:Date.now()}}
  else if(p&&!hasSets(S.sessions[id])){const s=S.sessions[id];s.src=srcFor(p,S.date);const d=p.days[s.src-1];s.t=d.t;s.title=d.title}
  if(!S.settings.start){S.settings.start=mondayOf(S.date);saveSettings()}
  return S.sessions[id];
}
function sorted(){return Object.entries(S.sessions).sort((a,b)=>a[1].date<b[1].date?1:a[1].date>b[1].date?-1:b[1].day-a[1].day)}
function lastFor(name){
  const mine=curId();
  for(const [id,s] of sorted()){
    if(id===mine||s.date>S.date)continue;
    const f=filled(s.entries&&s.entries[name]);
    if(f.length)return {date:s.date,unit:s.unit||"kg",sets:f};
  }
  return null;
}
function fmtSet(x,from){const w=conv(x.w,from,S.settings.unit);return (w!=null&&w>0?w+"x":"")+x.r}
function weekInfo(){
  if(!S.settings.start)return null;
  const days=Math.floor((parseISO(mondayOf(S.date))-parseISO(S.settings.start))/86400000);
  if(days<0)return null;
  const w=Math.floor(days/7)+1;
  return {week:w,cycle:((w-1)%6)+1};
}
function hintFor(ex,last){
  if(!last||!ex.lo)return null;
  const u=S.settings.unit;
  const ws=last.sets.map(x=>conv(x.w,last.unit,u)).filter(w=>w!=null&&w>0);
  const allTop=last.sets.length>=ex.s&&last.sets.slice(0,ex.s).every(x=>x.r>=ex.hi);
  if(ex.u==="sec"||ex.u==="min")return allTop?{up:true,t:"You hit "+ex.hi+" "+(ex.u==="sec"?"sec":"min")+" on every set. Add a set or a harder variation."}:{t:"Beat it: go a little longer than last time."};
  if(allTop&&ex.lo<ex.hi&&ws.length){const top=Math.max(...ws);const nx=Math.max(top+step(),roundTo(top*1.05,step()));
    return {up:true,t:"Top of the range on every set. Go up to "+nx+" "+u+" and aim for "+ex.lo+" reps."}}
  if(allTop&&ex.lo<ex.hi)return {up:true,t:"Top of the range on every set. Time to add weight or a harder variation."};
  return {t:"Beat it: one more rep, or +"+step()+" "+u+"."};
}

/* directory/{uid} is a small public card (name, nickname, thumbnail, short bio) so people can find each other.
   Everyone is listed unless they turn it off, which deletes their card. */
const DIR_KEY="infinity-dir-";
function thumbOf(src){
  if(!src||!src.startsWith("data:"))return Promise.resolve(src||"");
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{const n=96,c=document.createElement("canvas");c.width=c.height=n;
      const sd=Math.min(img.width,img.height);c.getContext("2d").drawImage(img,(img.width-sd)/2,(img.height-sd)/2,sd,sd,0,0,n,n);
      res(c.toDataURL("image/jpeg",0.7))};
    img.onerror=()=>res("");img.src=src;
  });
}
async function syncDirectory(force){
  if(S.mode!=="db"||!uid)return;
  const ref=doc(fs,"directory",uid);
  if(S.settings.findable===false){
    try{localStorage.removeItem(DIR_KEY+uid)}catch(e){}
    return deleteDoc(ref).catch(e=>console.warn("directory",e));
  }
  const data={name:(me.name||"").slice(0,80),nick:ME.nick||"",bio:(ME.bio||"").slice(0,80),photo:await thumbOf(myPhoto()),seen:today()};
  const key=JSON.stringify(data);
  let prev=null;try{prev=localStorage.getItem(DIR_KEY+uid)}catch(e){}
  if(!force&&prev===key)return;
  return setDoc(ref,data).then(()=>{try{localStorage.setItem(DIR_KEY+uid,key)}catch(e){}}).catch(e=>console.warn("directory",e));
}

function tPlan(id){return BUILTIN.find(p=>p.id===id)||(TR.plans[id]?{id,...TR.plans[id]}:null)}
function metaIn(s,getP){
  const p=getP(s.planId||"ppl");const d=p&&p.days[sessSrc(s)-1];
  return {t:s.t||(d&&d.t)||"other",title:s.title||(d&&d.title)||"Workout",plan:p,d};
}
function sortAsc(list){return list.slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.day-b.day)}
function setCount(s){let n=0;Object.values(s.entries||{}).forEach(a=>n+=filled(a).length);return n}
/* logged exercises in plan order: [{n,f,ex}] */
function exList(s,m){
  const order=m.d?m.d.ex.map(x=>x.n):[];
  return Object.entries(s.entries||{}).map(([n,a])=>({n,f:filled(a),ex:m.d&&m.d.ex.find(x=>x.n===n)})).filter(x=>x.f.length)
    .sort((a,b)=>{const i=order.indexOf(a.n),j=order.indexOf(b.n);return (i<0?99:i)-(j<0?99:j)});
}
function sessVolume(s){
  const u=S.settings.unit;let v=0;
  Object.values(s.entries||{}).forEach(a=>filled(a).forEach(x=>v+=(conv(x.w,s.unit||"kg",u)||0)*(x.r||0)));
  return v;
}
function wOf(x,s){const w=conv(x.w,s.unit||"kg",S.settings.unit);return w!=null&&w>0?w:null}

/* ---------- exercise tutorials ----------
   exercises/{slug(name)} holds a YouTube video id, set by admins. Loaded once per session;
   the player is only created when someone taps Watch, and never autoplays. */
const VIDS={};let vidsLoaded=false;
const YT_ID=/^[A-Za-z0-9_-]{11}$/;
/* a full watch URL, youtu.be link, shorts/embed link or bare id -> the 11-character id; "" for blank, null if unreadable */
function ytId(v){
  v=String(v||"").trim();if(!v)return "";
  if(YT_ID.test(v))return v;
  const ok=x=>YT_ID.test(x||"")?x:null;
  try{
    const u=new URL(/^https?:\/\//i.test(v)?v:"https://"+v);const h=u.hostname.replace(/^(www|m|music)\./,"");
    if(h==="youtu.be")return ok(u.pathname.split("/")[1]);
    if(h==="youtube.com"||h==="youtube-nocookie.com"){
      if(u.searchParams.get("v"))return ok(u.searchParams.get("v"));
      const m=u.pathname.match(/^\/(embed|shorts|live|v)\/([^/]+)/);if(m)return ok(m[2]);
    }
  }catch(e){}
  return null;
}
function vidFor(name){const v=VIDS[slug(name)];return v?v.id:""}
/* The name people see. Admins can rename an exercise; the data keeps the original name, so
   history, charts and "last time" stay connected. A combined entry like "Barbell or Dumbbell Curl"
   is rebuilt from its options when one of them was renamed. */
function dn(name){
  const v=VIDS[slug(name)];if(v&&v.display)return v.display;
  const parts=vidParts(name);
  if(parts.length<2||!parts.some(q=>VIDS[slug(q)]&&VIDS[slug(q)].display))return name;
  return parts.map(q=>{const w=VIDS[slug(q)];return w&&w.display?w.display:q}).join(" or ");
}
/* the other way, for the plan editor: a typed display name maps back to the name the data uses */
function canon(t){
  t=String(t||"").trim();if(!t)return t;
  const known=[...new Set([...BUILTIN.flatMap(p=>p.days.flatMap(d=>d.ex.map(x=>x.n))),...knownNames(),...Object.values(VIDS).map(v=>v.name)])];
  if(known.some(c=>c===t&&dn(c)===c))return t;
  const hit=known.find(c=>dn(c)!==c&&dn(c).toLowerCase()===t.toLowerCase());
  return hit||t;
}
async function loadVids(force){
  if(S.mode!=="db"||(vidsLoaded&&!force))return;
  vidsLoaded=true;
  try{
    const snap=await getDocs(collection(fs,"exercises"));
    Object.keys(VIDS).forEach(k=>delete VIDS[k]);
    snap.forEach(d=>{const v=d.data()||{};
      VIDS[d.id]={id:YT_ID.test(v.youtube||"")?v.youtube:"",name:v.name||d.id,display:typeof v.display==="string"?v.display.trim():"",added:v.added===true}});
    render();
  }catch(e){vidsLoaded=false;console.warn("tutorials",e)}
}
/* A plan entry can offer options ("Barbell or Dumbbell Curl", "Pull-ups / Lat Pulldown"). Each option is its own
   exercise for tutorials, while the plan entry (and so the logged history) keeps the combined name.
   A leading equipment or angle word borrows the shared ending: "Barbell or Dumbbell Curl" -> Barbell Curl, Dumbbell Curl. */
const VID_MODS=new Set(["barbell","dumbbell","dumbbells","cable","machine","smith","kettlebell","ez-bar","flat","incline","decline","seated","standing","single-arm","close-grip","wide-grip"]);
const VID_SPLIT={"triceps dips or pushdowns":["Triceps Dips","Triceps Pushdowns"]};
function vidParts(name){
  const n=String(name||"").trim();
  const o=VID_SPLIT[n.toLowerCase()];if(o)return o;
  const parts=n.split(/\s+or\s+|\s*\/\s*/i).map(x=>x.trim()).filter(Boolean);
  if(parts.length<2)return [n];
  const last=parts[parts.length-1].split(/\s+/),tail=last.length>1?last.slice(1).join(" "):"";
  const share=tail&&VID_MODS.has(last[0].toLowerCase());
  return parts.map((q,i)=>i<parts.length-1&&share&&!/\s/.test(q)&&VID_MODS.has(q.toLowerCase())?q+" "+tail:q);
}
/* videos for a plan entry: one per option that has one, plus any saved under the combined name */
function vidOpts(name){
  const parts=vidParts(name);
  const out=parts.map(n=>({n,id:vidFor(n)})).filter(x=>x.id);
  if(parts.length>1&&vidFor(name))out.push({n:name,id:vidFor(name)});
  return {multi:parts.length>1,list:out};
}
function watchBtns(name){
  const {multi,list}=vidOpts(name);
  return list.map(x=>{const label=multi?dn(x.n):"Watch";
    return `<button class="watch" data-watch="${x.id}" data-wname="${esc(dn(x.n))}" data-label="${esc(label)}" aria-expanded="false">${esc(label)}</button>`}).join("");
}
/* the Watch control for an exercise header: one plain button, or a row of labelled buttons for options */
function watchHead(name){return vidOpts(name).multi?"":watchBtns(name)}
function watchRow(name){const o=vidOpts(name);return o.multi&&o.list.length?`<div class="watches">${watchBtns(name)}</div>`:""}
/* one video open at a time; the iframe only exists while it's open */
function toggleVid(btn){
  const box=btn.closest("section,.dex").querySelector(".vid");
  const wasOpen=btn.getAttribute("aria-expanded")==="true";
  document.querySelectorAll(".vid").forEach(v=>{v.innerHTML="";v.classList.remove("on")});
  document.querySelectorAll("[data-watch]").forEach(b=>{b.setAttribute("aria-expanded","false");b.textContent=b.dataset.label||"Watch"});
  if(wasOpen||!box||!YT_ID.test(btn.dataset.watch))return;
  box.classList.add("on");
  box.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${btn.dataset.watch}?rel=0&playsinline=1" title="${esc(btn.dataset.wname)} tutorial" loading="lazy"
    allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
  btn.setAttribute("aria-expanded","true");btn.textContent="Hide video";
}
function downloadText(name,text,type){
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function csvOf(list,getP){
  const u=S.settings.unit;
  const q=v=>{v=v==null?"":String(v);return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const rows=[["Date","Workout","Plan","Exercise","Set","Weight ("+u+")","Reps","Unit","Done","Deload"]];
  sortAsc(list).forEach(s=>{
    const m=metaIn(s,getP);
    exList(s,m).forEach(x=>x.f.forEach((z,k)=>rows.push([s.date,m.title,m.plan?m.plan.name:"",dn(x.n),k+1,wOf(z,s)??"",z.r,
      x.ex&&x.ex.u?x.ex.u:"reps",z.done?"yes":"no",s.deload?"yes":""])));
  });
  return "﻿"+rows.map(r=>r.map(q).join(",")).join("\r\n");
}
function reportHtml(title,sub,list,getP){
  const u=S.settings.unit;
  /* oldest first, and exercises in the order the plan schedules them */
  const asc=sortAsc(list);
  let sets=0,vol=0;const best={};
  asc.forEach(s=>{sets+=setCount(s);vol+=sessVolume(s);
    exList(s,metaIn(s,getP)).forEach(x=>x.f.forEach(z=>{
      const w=wOf(z,s)||0,b=best[x.n];if(!b||w>b.w||(w===b.w&&z.r>b.r))best[x.n]={w,r:z.r,d:s.date};
    }));
  });
  const weeks=new Set(asc.map(s=>mondayOf(s.date))).size;
  const fmtS=(z,s)=>{const w=wOf(z,s);return (w!=null?w+"×":"")+z.r};
  const bestRows=Object.entries(best)
    .map(([n,b])=>`<tr><td>${esc(dn(n))}</td><td>${b.w>0?b.w+" "+u+" × ":""}${b.r}</td><td>${fmtDate(b.d)}</td></tr>`).join("");
  const days=asc.map(s=>{const m=metaIn(s,getP);const v=sessVolume(s);
    return `<section class="rp-day"><h3>${parseISO(s.date).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short",year:"numeric"})} · ${esc(m.title)}${s.deload?" (deload)":""}</h3>
      <p>${m.plan?esc(m.plan.name)+" · ":""}${setCount(s)} sets${v>0?" · "+fmtNum(v)+" "+u+" volume":""}</p>
      <table><thead><tr><th>Exercise</th><th>Sets (${u} × reps)</th><th>Planned</th></tr></thead><tbody>
      ${exList(s,m).map(x=>`<tr><td>${esc(dn(x.n))}</td><td>${x.f.map(z=>fmtS(z,s)).join(", ")}</td><td>${x.ex?esc(target(x.ex,setsFor(x.ex,s.deload))):""}</td></tr>`).join("")}
      </tbody></table></section>`}).join("");
  return `<h1>${esc(title)}</h1><p>${esc(sub)} · Generated ${new Date().toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"})} · ${APP_NAME}</p>
    <div class="rp-stats"><div><b>${asc.length}</b>workouts</div><div><b>${sets}</b>sets</div><div><b>${fmtNum(vol)}</b>volume (${u})</div><div><b>${weeks}</b>active weeks</div></div>
    ${asc.length>1&&bestRows?`<h2>Best sets</h2><table><thead><tr><th>Exercise</th><th>Best</th><th>Date</th></tr></thead><tbody>${bestRows}</tbody></table>`:""}
    <h2>Workouts</h2>${days||"<p>No workouts in this period.</p>"}`;
}
function printHtml(html){
  let el=$("#printArea");
  if(!el){el=document.createElement("div");el.id="printArea";document.body.appendChild(el)}
  el.innerHTML=html;document.body.classList.add("printing");
  const done=()=>{document.body.classList.remove("printing");el.innerHTML="";window.removeEventListener("afterprint",done)};
  window.addEventListener("afterprint",done);
  window.print();
}

/* ---------- share as image ---------- */
/* Cards are drawn in the dark palette so they look the same whatever theme the phone uses. */
const CARD={bg:"#11151B",surface:"#1A2029",field:"#222A35",line:"#2D3542",ink:"#E7EBF0",muted:"#98A2B1",
  push:"#E3574F",pull:"#5B8CDD",legs:"#E9BE3C",core:"#4DB07A",cardio:"#38B2C2"};
const CARD_TYPES={push:["push"],pull:["pull"],legs:["legs"],upper:["push","pull"],lower:["legs","core"],full:["push","pull","legs"],
  legscore:["legs","core"],core:["core"],cardio:["cardio"]};
const CARD_LIFTS={"Bench Press":"push","Squat":"legs","Deadlift or Rack Pull":"pull","Overhead Press":"core"};
const INF_D="M60 30C50 14 42 10 32 10C20 10 12 19 12 30S20 50 32 50C42 50 50 46 60 30S78 10 88 10C100 10 108 19 108 30S100 50 88 50C78 50 70 46 60 30Z";
const CW=1080,PAD=80;
function typeColors(t){return (CARD_TYPES[t]||["muted"]).map(k=>CARD[k])}
function cf(w,px,disp){return `${w} ${px}px ${disp?'"Barlow Condensed","Arial Narrow",Arial,sans-serif':'Barlow,system-ui,sans-serif'}`}
async function cardFonts(){
  if(!document.fonts)return;
  const want=['800 100px "Barlow Condensed"','700 40px "Barlow Condensed"','500 30px Barlow','600 30px Barlow'];
  try{await Promise.race([Promise.all(want.map(f=>document.fonts.load(f))),new Promise(r=>setTimeout(r,2500))])}catch(e){}
}
function loadImg(src){
  return new Promise(res=>{
    if(!src)return res(null);
    const img=new Image(),t=setTimeout(()=>res(null),3000);
    img.crossOrigin="anonymous";img.referrerPolicy="no-referrer";
    img.onload=()=>{clearTimeout(t);res(img)};img.onerror=()=>{clearTimeout(t);res(null)};img.src=src;
  });
}
function fitText(ctx,t,max){
  t=String(t||"");if(ctx.measureText(t).width<=max)return t;
  while(t.length&&ctx.measureText(t+"…").width>max)t=t.slice(0,-1);
  return t.trimEnd()+"…";
}
function rrect(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function box(ctx,x,y,w,h,accent){
  ctx.fillStyle=CARD.surface;rrect(ctx,x,y,w,h,24);ctx.fill();
  if(accent){ctx.save();rrect(ctx,x,y,w,h,24);ctx.clip();ctx.fillStyle=accent;ctx.fillRect(x,y,8,h);ctx.restore()}
}
function disc(ctx,x,y,r,cols){
  const a=Math.PI*2/cols.length;
  cols.forEach((c,i)=>{ctx.beginPath();ctx.moveTo(x,y);ctx.arc(x,y,r,-Math.PI/2+i*a,-Math.PI/2+(i+1)*a);ctx.closePath();ctx.fillStyle=c;ctx.fill()});
}
function drawAvatar(ctx,img,name,x,y,r){
  ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.clip();
  if(img){const s=Math.min(img.width,img.height);ctx.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,x-r,y-r,r*2,r*2)}
  else{
    ctx.fillStyle=CARD.field;ctx.fillRect(x-r,y-r,r*2,r*2);
    const i=(name||"?").trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase()||"?";
    ctx.fillStyle=CARD.muted;ctx.font=cf(700,r*0.8,true);ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(i,x,y+2);
  }
  ctx.restore();ctx.textAlign="left";ctx.textBaseline="alphabetic";
}
function cardStart(H){
  const c=document.createElement("canvas");c.width=CW;c.height=H;
  const ctx=c.getContext("2d");
  ctx.fillStyle=CARD.bg;ctx.fillRect(0,0,CW,H);
  const g=ctx.createLinearGradient(0,0,CW,0);g.addColorStop(0,CARD.push);g.addColorStop(.5,CARD.pull);g.addColorStop(1,CARD.legs);
  ctx.fillStyle=g;ctx.fillRect(0,0,CW,10);
  ctx.save();ctx.translate(PAD-10,62);ctx.scale(0.9,0.9);
  const gm=ctx.createLinearGradient(12,0,108,0);gm.addColorStop(0,CARD.push);gm.addColorStop(.5,CARD.pull);gm.addColorStop(1,CARD.legs);ctx.strokeStyle=gm;ctx.lineWidth=9;ctx.lineCap="round";ctx.stroke(new Path2D(INF_D));ctx.restore();
  ctx.fillStyle=CARD.ink;ctx.font=cf(800,46,true);ctx.fillText("INFINITY",PAD+110,112);
  return {c,ctx};
}
function cardEnd(ctx,H){
  ctx.fillStyle=CARD.muted;ctx.font=cf(500,28);
  ctx.fillText(APP_NAME,PAD,H-70);
  ctx.textAlign="right";ctx.fillText(new Date().toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}),CW-PAD,H-70);ctx.textAlign="left";
}
function kicker(ctx,t,y){ctx.fillStyle=CARD.muted;ctx.font=cf(600,28);ctx.fillText(t.toUpperCase().split("").join(String.fromCharCode(8202)),PAD,y)}
/* the largest font, from px down to min, at which text fits in max; cut with an ellipsis only below min */
function fitFont(ctx,t,max,px,min,w,disp){
  for(;px>min;px-=2){ctx.font=cf(w,px,disp);if(ctx.measureText(t).width<=max)return t}
  ctx.font=cf(w,min,disp);return fitText(ctx,t,max);
}
function stat3(ctx,y,items){
  const w=(CW-PAD*2-48)/3;
  items.forEach(([v,l],i)=>{
    const x=PAD+i*(w+24);box(ctx,x,y,w,190);
    const t=fitFont(ctx,v,w-56,104,48,800,true);
    ctx.fillStyle=CARD.ink;ctx.fillText(t,x+28,y+112);
    ctx.fillStyle=CARD.muted;ctx.font=cf(500,30);ctx.fillText(fitText(ctx,l,w-56),x+28,y+160);
  });
}
function toBlob(c){return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error("blob")),"image/png"))}

  ctx.fillStyle=CARD.muted;ctx.font=cf(500,32);ctx.fillText(fitText(ctx,sum.planName||"",CW-PAD*2-180),PAD+170,316);
  kicker(ctx,"This week",440);
  const slot=(CW-PAD*2)/7;
  WD.forEach((w,i)=>{

    if(t)disc(ctx,x,520,42,typeColors(t));
    else{ctx.beginPath();ctx.arc(x,520,40,0,Math.PI*2);ctx.strokeStyle=CARD.line;ctx.lineWidth=5;ctx.stroke()}
    ctx.fillStyle=t?CARD.ink:CARD.muted;ctx.font=cf(600,28);ctx.textAlign="center";ctx.fillText(w,x,610);ctx.textAlign="left";
  });
  stat3(ctx,660,[[String(sum.weekDays.length),sum.weekDays.length===1?"workout":"workouts"],[String(sum.streak||0),"week streak"],[String(sum.total||0),"all time"]]);
  kicker(ctx,"Best lifts ("+u+")",950);
  const lw=(CW-PAD*2-60)/4;
  KEY_LIFTS.forEach(([n,l],i)=>{

    ctx.fillStyle=CARD.ink;ctx.font=cf(800,72,true);

function fmtCardSet(x,from,ex){
  const w=conv(x.w,from,S.settings.unit);
  const r=x.r+(ex&&ex.u==="sec"?"s":ex&&ex.u==="min"?"m":"");
  return w!=null&&w>0?w+"×"+r:r;
}
/* a soft glow in the workout's colour behind the header */
function glow(ctx,col){
  /* fade to the same colour at zero alpha: "transparent" is transparent black and muddies the colour into a brown smudge */
  const n=parseInt(col.slice(1),16),rgb=`${n>>16},${n>>8&255},${n&255}`;
  const g=ctx.createRadialGradient(CW,0,0,CW,0,760);
  g.addColorStop(0,`rgba(${rgb},.26)`);g.addColorStop(.45,`rgba(${rgb},.1)`);g.addColorStop(1,`rgba(${rgb},0)`);
  ctx.fillStyle=g;ctx.fillRect(0,10,CW,770);
}
/* exercise rows: a number, the name, then every set as a pill that wraps; the best set is filled in the day colour.
   Laid out twice like the plan card: once to measure, once to draw. */
const PILL_H=62,PILL_GAP=14,PILL_PAD=24;
function workoutRows(ctx,rows,s,d,col,top,draw){
  const X0=PAD+84,W=CW-PAD-X0;let y=top;
  rows.forEach((x,i)=>{
    const ex=d.ex.find(e=>e.n===x.n);
    if(i&&draw){ctx.fillStyle=CARD.line;ctx.fillRect(PAD,y-26,CW-PAD*2,2)}
    if(draw){
      ctx.fillStyle=CARD.muted;ctx.font=cf(800,44,true);ctx.fillText(String(i+1).padStart(2,"0"),PAD,y+42);
      ctx.fillStyle=CARD.ink;ctx.font=cf(700,46,true);ctx.fillText(fitText(ctx,dn(x.n),W),X0,y+42);
    }
    let best=-1,bw=-1,br=-1;
    x.f.forEach((z,k)=>{const w=conv(z.w,s.unit||"kg",S.settings.unit)||0;if(w>0&&(w>bw||(w===bw&&z.r>br))){best=k;bw=w;br=z.r}});
    let px=X0,py=y+70;ctx.font=cf(600,32);
    x.f.forEach((z,k)=>{
      const t=fmtCardSet(z,s.unit||"kg",ex),tw=ctx.measureText(t).width+PILL_PAD*2;
      if(px>X0&&px+tw>CW-PAD){px=X0;py+=PILL_H+PILL_GAP}
      if(draw){
        ctx.fillStyle=k===best?col:CARD.surface;rrect(ctx,px,py,tw,PILL_H,PILL_H/2);ctx.fill();
        ctx.fillStyle=k===best?CARD.bg:CARD.ink;ctx.font=cf(600,32);ctx.fillText(t,px+PILL_PAD,py+42);
      }
      px+=tw+PILL_GAP;
    });
    y=py+PILL_H+56;
  });
  return y;
}
async function workoutCard(){
  const s=cur();const d=day();const m=sessionMeta(s);const u=S.settings.unit;
  const rows=Object.entries(s.entries||{}).map(([n,a])=>({n,f:filled(a)})).filter(x=>x.f.length);
  const order=d.ex.map(x=>x.n);
  rows.sort((a,b)=>{const i=order.indexOf(a.n),j=order.indexOf(b.n);return (i<0?99:i)-(j<0?99:j)});
  let sets=0,vol=0,reps=0;
  rows.forEach(x=>x.f.forEach(z=>{sets++;reps+=z.r||0;vol+=(conv(z.w,s.unit||"kg",u)||0)*(z.r||0)}));
  const TOP=740,MAXROWS=10;
  const shown=rows.length>MAXROWS?rows.slice(0,MAXROWS-1):rows;
  const more=rows.length-shown.length;
  await cardFonts();
  const col=typeColors(m.t)[0];
  const end=workoutRows(document.createElement("canvas").getContext("2d"),shown,s,d,col,TOP,false);
  const H=Math.max(1350,end+(more?70:0)+130);
  const {c,ctx}=cardStart(H);
  glow(ctx,col);
  kicker(ctx,parseISO(s.date).toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"}),240);
  ctx.fillStyle=col;ctx.font=cf(800,132,true);ctx.fillText(fitText(ctx,m.title,CW-PAD*2),PAD,366);
  const pl=getPlan(s.planId||"ppl");
  ctx.fillStyle=CARD.muted;ctx.font=cf(500,32);ctx.fillText(fitText(ctx,[myName(),pl&&pl.name].filter(Boolean).join("  ·  "),CW-PAD*2),PAD,422);
  stat3(ctx,476,[[String(rows.length),rows.length===1?"exercise":"exercises"],[String(sets),sets===1?"set":"sets"],
    vol>0?[fmtNum(vol),"volume ("+u+")"]:[String(reps),"total reps"]]);
  workoutRows(ctx,shown,s,d,col,TOP,true);
  if(more){ctx.fillStyle=CARD.muted;ctx.font=cf(600,30);ctx.fillText("+"+more+" more exercise"+(more===1?"":"s"),PAD+84,end+10)}
  cardEnd(ctx,H);
  return toBlob(c);
}

function wrapText(ctx,t,max){
  const out=[];let line="";
  String(t||"").split(/\s+/).forEach(w=>{const n=line?line+" "+w:w;if(line&&ctx.measureText(n).width>max){out.push(line);line=w}else line=n});
  if(line)out.push(line);return out;
}
/* The generated plan as an image, for installed iOS apps where printing may not work.
   Laid out twice: once to measure the height, once to draw. */
function planCardLayout(ctx,draw){
  const p=GEN.plan,W=CW-PAD*2;let y=230;
  const text=(t,font,color,x,align)=>{if(!draw)return;ctx.font=font;ctx.fillStyle=color;ctx.textAlign=align||"left";ctx.fillText(t,x,y);ctx.textAlign="left"};
  ctx.font=cf(800,72,true);text(fitText(ctx,p.name,W),cf(800,72,true),CARD.ink,PAD);
  ctx.font=cf(500,30);wrapText(ctx,GEN.info,W).forEach(l=>{y+=44;text(l,cf(500,30),CARD.muted,PAD)});
  genInsightParts().forEach(([h,v])=>{
    y+=80;text(h,cf(700,38,true),CARD.ink,PAD);ctx.font=cf(500,30);
    (Array.isArray(v)?v.map(x=>"• "+x):[v]).forEach(t=>wrapText(ctx,t,W).forEach(l=>{y+=44;text(l,cf(500,30),CARD.muted,PAD)}));
  });
  p.days.forEach((d,i)=>{
    if(d.t==="rest")return;
    y+=100;ctx.font=cf(700,50,true);text(fitText(ctx,WD_LONG[i]+": "+d.title,W),cf(700,50,true),typeColors(d.t)[0],PAD);
    d.ex.forEach(x=>{
      y+=54;ctx.font=cf(500,32);const t=target(x);const tw=ctx.measureText(t).width;
      text(fitText(ctx,dn(x.n),W-tw-30),cf(500,32),CARD.ink,PAD);text(t,cf(500,32),CARD.muted,CW-PAD,"right");
    });
    if(d.note){ctx.font=cf(500,28);y+=12;wrapText(ctx,d.note,W).forEach(l=>{y+=40;text(l,cf(500,28),CARD.muted,PAD)})}
  });
  y+=90;ctx.font=cf(500,28);wrapText(ctx,GEN_NOTE,W).forEach(l=>{y+=40;text(l,cf(500,28),CARD.muted,PAD)});
  return y+150;
}
async function planCard(){
  await cardFonts();
  const H=Math.max(1350,planCardLayout(document.createElement("canvas").getContext("2d"),false));
  const {c,ctx}=cardStart(H);
  planCardLayout(ctx,true);cardEnd(ctx,H);
  return toBlob(c);
}

let SHARE=null;
async function openShare(kind){
  if(kind==="workout"&&!(cur()&&hasSets(cur()))){setStatus("Log at least one set to share this workout.");return}
  let blob;
  try{blob=await (kind==="workout"?workoutCard():kind==="plan"?planCard():progressCard())}
  catch(e){console.warn("share card",e);alert("Couldn't make the image. Try again.");return}
  const name=(kind==="workout"?"workout-"+cur().date:kind==="plan"?slug(GEN.plan.name)+"-"+today():"progress-"+today())+".png";
  const file=new File([blob],name,{type:"image/png"});
  const canShare=!!(navigator.canShare&&navigator.canShare({files:[file]}));
  closeShare();
  SHARE={file,url:URL.createObjectURL(blob)};
  let dlg=$("#shareDlg");
  if(!dlg){dlg=document.createElement("dialog");dlg.id="shareDlg";dlg.className="share";document.body.appendChild(dlg);
    dlg.addEventListener("close",closeShare);dlg.addEventListener("click",e=>{if(e.target===dlg)dlg.close()})}
  dlg.innerHTML=`<div class="sheet"><img src="${SHARE.url}" alt="${kind==="workout"?"Workout summary":kind==="plan"?"Workout plan":"Progress summary"} image">
    <div class="row">${canShare?`<button class="btn primary" id="shareImg">Share</button>`:""}
      <a class="btn ${canShare?"":"primary"}" href="${SHARE.url}" download="${name}">Save image</a>
      <button class="btn" id="closeShare">Close</button></div>
    <p class="small muted">${kind==="plan"?(canShare?"Share it to Files, Photos or any app.":"Save the image to keep a copy of your plan."):canShare?"Share straight to Instagram, WhatsApp or any app.":"Save the image, then post it from Instagram, WhatsApp or any app."}</p></div>`;
  if(!dlg.open)dlg.showModal();
}
function closeShare(){
  if(!SHARE)return;
  const dlg=$("#shareDlg");const url=SHARE.url;SHARE=null;
  if(dlg&&dlg.open)dlg.close();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function beatText(e,l,last){
  if(!l||e.r==null)return "";
  const u=S.settings.unit;

  const lw=l.w!=null?conv(l.w,last.unit,u):0;
  return (ew>lw||(ew===lw&&e.r>l.r))?"Beat it":"";
}

function loadScript(src){
  return new Promise((res,rej)=>{
    if([...document.scripts].some(s=>s.src===src))return res();
    const el=document.createElement("script");el.src=src;el.onload=()=>res();el.onerror=()=>rej(new Error("load"));
    document.head.appendChild(el);
  });
}
const TYPE_WORDS=[[/\bpush\b/i,"push"],[/\bpull\b/i,"pull"],[/\bupper\b/i,"upper"],[/\blower\b/i,"lower"],[/\bfull\s*body\b/i,"full"],
  [/\blegs?\b/i,"legs"],[/\bcore|abs\b/i,"core"],[/\bcardio|run|conditioning\b/i,"cardio"],[/\brest|off\s*day\b/i,"rest"]];
const EX_RE=/^(.*?)[\s:.\-–|]*?(\d{1,2})\s*(?:x|×|\*|sets?\s*(?:of|x)?)\s*(\d{1,3})(?:\s*(?:-|–|to)\s*(\d{1,3}))?\s*(seconds?|secs?|minutes?|mins?|reps?)?\s*(?:\(?\s*(?:\/|per\s*|each\s*)(leg|side)s?\s*\)?)?\s*$/i;
function typeOf(text){for(const [re,t] of TYPE_WORDS)if(re.test(text))return t;return "other"}
function cleanName(s){return String(s||"").replace(/^[\s\-–—•·*\d.)|:]+/,"").replace(/[\s:\-–—•·|]+$/,"").trim()}
const WD_RE=/\b(mondays?|tuesdays?|wednesdays?|thursdays?|fridays?|saturdays?|sundays?)\b/ig;
/* "Monday PUSH - Chest, shoulders" becomes title "Push" and focus "Chest, shoulders" */
function headOf(text){return String(text||"").split(/\s*[—–\-|:]\s+|\s{2,}/)[0]||""}
/* the type comes from the heading itself first, so "LEGS - Main Lower Body Day" is Legs, not Lower */
function titleFocus(text){
  const parts=String(text||"").split(/\s*[—–\-|:]\s+|\s{2,}/).map(x=>cleanName(x.replace(WD_RE,""))).filter(Boolean);
  let title=parts.shift()||"";
  const focus=parts.join(", ");
  let t=typeOf(title);
  if(t==="other")t=typeOf(text||"");
  if(t!=="other"&&(!title||title.length>24||new RegExp(TYPE_WORDS.find(w=>w[1]===t)[0]).test(title)))title=tinfo(t).label;
  return {t,title:title||tinfo(t).label,focus};
}
function unitOf(a,b){
  const u=(a||"").toLowerCase(),side=(b||"").toLowerCase();
  if(/sec/.test(u))return "sec";
  if(/min/.test(u))return "min";
  if(/leg/.test(side))return "per leg";
  if(/side/.test(side))return "per side";
  return "";
}
function parseLines(lines){
  const out=[],warn=[];let cur=null,prev=null;
  const push=()=>{prev=cur;if(cur&&(cur.ex.length||cur.t==="rest"))out.push(cur)};
  for(const raw of lines){
    const line=String(raw||"").replace(/\s+/g," ").trim();
    if(!line||line.length>160)continue;
    const wd=line.match(/^(mon|tues?|wed(nes)?|thu(rs)?|fri|sat(ur)?|sun)[a-z]*\b[\s:.\-–|]*(.*)$/i);
    const dn=line.match(/^day\s*(\d{1,2})\b[\s:.\-–|]*(.*)$/i);
    const ex=line.match(EX_RE);
    if(!ex&&(wd||dn)){
      push();
      const restText=(wd?wd[6]:dn[2])||"";
      const wdIdx=wd?["mo","tu","we","th","fr","sa","su"].indexOf(wd[1].slice(0,2).toLowerCase()):-1;
      let tf=titleFocus(restText||line);let t=tf.t;
      /* some files put the type on the line above, as in "PUSH - Chest" then "Day 1 . Monday" */
      if(prev&&!prev.ex.length&&t==="other"&&prev.t!=="other"){t=prev.t;tf={title:prev.title,focus:prev.focus}}
      cur={wd:wdIdx,t,title:tf.title,focus:tf.focus,note:"",ex:[]};
      continue;
    }
    if(ex){
      const name=cleanName(ex[1]);
      if(!name){warn.push(line);continue}
      if(!cur)cur={wd:-1,t:"other",title:"Workout",focus:"",note:"",ex:[]};
      const lo=+ex[3],hi=ex[4]?+ex[4]:+ex[3];
      cur.ex.push(X(name,Math.min(20,Math.max(1,+ex[2])),lo,Math.max(lo,hi),unitOf(ex[5],ex[6])));
      continue;
    }
    /* a short line with a known workout word starts a day */
    if(!/\d/.test(line)&&headOf(line).split(" ").length<=6&&typeOf(headOf(line))!=="other"){
      const tf=titleFocus(line);const t=tf.t;
      /* or the type comes just after the day heading */
      if(cur&&!cur.ex.length&&cur.t==="other"){cur.t=t;cur.title=tf.title;cur.focus=tf.focus||cur.focus;continue}
      push();
      cur={wd:-1,t,title:tf.title,focus:tf.focus,note:"",ex:[]};
      continue;
    }
    if(/\d/.test(line))warn.push(line);
  }
  push();
  return {days:out,warn};
}
function parseSheet(rows){
  const head=rows.findIndex(r=>r.some(c=>/exercise|movement|workout/i.test(c))&&r.some(c=>/sets?/i.test(c)));
  if(head<0)return parseLines(rows.map(r=>r.filter(c=>c!=="").join(" ")));
  const H=rows[head].map(c=>String(c).toLowerCase());
  const col=re=>H.findIndex(c=>re.test(c));
  const ci={day:col(/day|weekday/),ex:col(/exercise|movement|workout/),sets:col(/sets?/),reps:col(/reps?|rep range|count/),unit:col(/unit|counted|measure/)};
  const out=[],warn=[];let cur=null;
  for(let i=head+1;i<rows.length;i++){
    const r=rows[i];if(!r.some(c=>c!==""))continue;
    const dayCell=ci.day>=0?String(r[ci.day]||"").trim():"";
    if(dayCell){
      const wd=dayCell.match(/^(mon|tues?|wed(nes)?|thu(rs)?|fri|sat(ur)?|sun)/i);
      const key=dayCell.toLowerCase();
      if(!cur||cur.key!==key){
        if(cur)out.push(cur);
        const tf=titleFocus(dayCell);
        cur={key,wd:wd?["mo","tu","we","th","fr","sa","su"].indexOf(wd[1].slice(0,2).toLowerCase()):-1,
          t:tf.t,title:tf.title,focus:tf.focus,note:"",ex:[]};
      }
    }
    const name=cleanName(ci.ex>=0?String(r[ci.ex]||""):"");
    if(!name||!cur)continue;
    if(/^rest$/i.test(name)){cur.t="rest";continue}
    const sets=Math.min(20,Math.max(1,parseInt(ci.sets>=0?r[ci.sets]:"",10)||3));
    const repTxt=String(ci.reps>=0?r[ci.reps]:"").trim();
    const m=repTxt.match(/(\d{1,3})(?:\s*(?:-|–|to)\s*(\d{1,3}))?/);
    const lo=m?+m[1]:8,hi=m&&m[2]?+m[2]:(m?+m[1]:12);
    const unitTxt=(ci.unit>=0?String(r[ci.unit]):"")+" "+repTxt;
    cur.ex.push(X(name,sets,lo,Math.max(lo,hi),unitOf(/sec|min/i.test(unitTxt)?unitTxt:"",/leg|side/i.test(unitTxt)?unitTxt:"")));
  }
  if(cur)out.push(cur);
  return {days:out,warn};
}
/* turn parsed days into a 7-day plan */
function toPlan(parsed,name){
  const days=WD.map(()=>REST());
  let next=0;const used=new Set();
  parsed.days.forEach(d=>{
    let i=d.wd>=0?d.wd:-1;
    if(i<0||used.has(i)){while(next<7&&used.has(next))next++;i=next}
    if(i>=7)return;
    used.add(i);next=Math.max(next,i+1);
    days[i]=d.t==="rest"||!d.ex.length?REST():{t:d.t==="other"?typeOf(d.title):d.t,title:d.title||"Workout",focus:d.focus||"",note:"",ex:d.ex};
  });
  return {name,days};
}
function splitCsv(line){
  const out=[];let cur="",q=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(q){ if(c==='"'&&line[i+1]==='"'){cur+='"';i++} else if(c==='"'){q=false} else cur+=c; }
    else if(c==='"')q=true;
    else if(c===","){out.push(cur.trim());cur=""}
    else cur+=c;
  }
  out.push(cur.trim());return out;
}
async function importFile(file){
  const nm=(file.name||"plan").replace(/\.[^.]+$/,"");
  say("Reading "+file.name+"...",true);
  try{
    let parsed;
    if(/\.pdf$/i.test(file.name)){
      await loadScript("./lib/pdf.min.js");
      const lib=window.pdfjsLib;
      lib.GlobalWorkerOptions.workerSrc="./lib/pdf.worker.min.js";
      const buf=await file.arrayBuffer();
      const pdf=await lib.getDocument({data:buf}).promise;
      const lines=[];
      for(let i=1;i<=pdf.numPages;i++){
        const page=await pdf.getPage(i);const tc=await page.getTextContent();
        const rows={};
        tc.items.forEach(it=>{
          const y=Math.round(it.transform[5]);
          (rows[y]||(rows[y]=[])).push({x:it.transform[4],s:it.str});
        });
        Object.keys(rows).map(Number).sort((a,b)=>b-a)
          .forEach(y=>lines.push(rows[y].sort((a,b)=>a.x-b.x).map(o=>o.s).join(" ")));
      }
      parsed=parseLines(lines);
    }else if(/\.csv$/i.test(file.name)){
      const text=await file.text();
      const rows=text.split(/\r?\n/).filter(l=>l.trim()).map(splitCsv);
      parsed=parseSheet(rows);
    }else{
      await loadScript("./lib/xlsx.min.js");
      const wb=window.XLSX.read(await file.arrayBuffer(),{type:"array"});
      const rows=[];
      wb.SheetNames.forEach(sn=>{
        window.XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,blankrows:false,defval:""})
          .forEach(r=>rows.push(r.map(c=>String(c==null?"":c).trim())));
      });
      parsed=parseSheet(rows);
    }
    const workouts=parsed.days.filter(d=>d.ex&&d.ex.length);
    if(!workouts.length){say("Couldn't find any exercises in that file. It needs lines like \"Bench Press 4 x 6-8\", or columns for Day, Exercise, Sets and Reps.");return}
    const total=workouts.reduce((a,d)=>a+d.ex.length,0);
    openEditor(toPlan(parsed,nm));
    S.draftNote="Imported "+workouts.length+" workout day"+(workouts.length===1?"":"s")+" and "+total+" exercises from "+file.name+". Check everything below, then save."
      +(parsed.warn.length?" "+parsed.warn.length+" line"+(parsed.warn.length===1?"":"s")+" couldn't be read and were skipped.":"");
    render();
  }catch(err){
    console.warn(err);
    say(/\.pdf$/i.test(file.name)?"Couldn't read that PDF. Check your connection, or export the plan as Excel or CSV and try again.":"Couldn't read that file. Excel (.xlsx), CSV and PDF are supported.");
  }
}

function savePlan(){
  const D=S.draft;
  const name=(D.name||"").trim();
  if(!name)return failDraft("Give your plan a name.");
  const days=[];
  for(let i=0;i<7;i++){
    const d=D.days[i];
    if(d.t==="rest"){days.push({t:"rest",title:"Rest",focus:(d.focus||"").trim(),note:"",ex:[]});continue}
    const ex=[];
    for(const x of d.ex){
      const n=canon(x.n);
      if(!n)continue;
      const s=num(x.s),lo=num(x.lo),hi=num(x.hi)??lo;
      if(!s||s<1||s>20)return failDraft(WD_LONG[i]+": "+dn(n)+" needs between 1 and 20 sets.");
      if(lo==null||lo<1)return failDraft(WD_LONG[i]+": "+dn(n)+" needs a minimum of at least 1.");
      if(hi<lo)return failDraft(WD_LONG[i]+": for "+dn(n)+", the max can't be lower than the min.");
      if(ex.some(e=>e.n.toLowerCase()===n.toLowerCase()))return failDraft(WD_LONG[i]+": "+dn(n)+" is listed twice. Use one entry with more sets.");
      ex.push({n,s:Math.round(s),lo:Math.round(lo),hi:Math.round(hi),u:x.u||""});
    }
    if(!ex.length)return failDraft(WD_LONG[i]+" has no exercises. Add at least one, or set the day to Rest.");
    days.push({t:d.t,title:(d.title||"").trim()||tinfo(d.t).label,focus:(d.focus||"").trim(),note:(d.note||"").trim(),ex});
  }
  if(!days.some(d=>d.t!=="rest"))return failDraft("Add at least one workout day.");
  const isNew=!S.draftId;
  const id=S.draftId||newId();
  const plan={name,days,updated:Date.now()};
  if(S.coachFor){
    const tid=S.coachFor;TR.plans[id]=plan;
    setDoc(doc(fs,"users",tid,"log","plan_"+id),clone(plan))
      .then(()=>{if(isNew)assignPlan(id)})
      .catch(e=>say(fbError(e,"save their plan")));
    S.draft=null;S.draftId=null;S.coachFor=null;S.view="trainee";
    S.msg=isNew?"Plan saved for "+TR.name+" and set as their plan.":"Plan saved for "+TR.name+".";S.msgOk=true;
    render();window.scrollTo(0,0);return;
  }
  S.plans[id]=plan;
  writeDoc("plan_"+id,clone(plan)).catch(()=>say("Couldn't save the plan. Check your connection and try again."));
  if(isNew)usePlan(id);
  S.draft=null;S.draftId=null;S.view="plans";
  S.msg=isNew?"Plan saved and set as your current plan.":"Plan saved.";S.msgOk=true;
  render();window.scrollTo(0,0);
}

/* ---------- Advanced (AI planning) ----------
   The Advanced tab sends body stats, a goal in the user's words, days per week, best lifts and an optional
   photo to an AI model (Google Gemini by default, or Claude) through the proxy in AI_PROXY (firebase-config.js),
   with the user's Firebase ID token. The AI returns insights, a 7-day plan and, if the user added one, a diet plan in the cuisine they chose. The proxy keeps the API key, checks the account is approved,
   limits requests per day and stores nothing. Setup: PROXY_SETUP.md. */
const GEN_LIFTS=[["bench","Bench press"],["squat","Squat"],["deadlift","Deadlift"],["ohp","Overhead press"]];
const GEN_NOTE="This is a general training plan, not medical advice. If you have an injury or a health condition, check with a professional before you start.";
const GEN_DIETS=[["kerala","Kerala"],["south","South Indian"],["north","North Indian"]];
const GEN_DIET_NOTE="The diet plan is general guidance, not a dietitian's advice. If you have diabetes, a kidney or heart condition, allergies, are pregnant or have a medical condition, check with a doctor or dietitian first.";
const GEN_PHOTO_MAX=1024;/* long edge in px: plenty for the AI, and keeps the upload small */
const GEN={wt:"",hu:"cm",cm:"",ft:"",inch:"",goal:"",days:4,level:"beginner",lifts:{},photo:null,plan:null,ins:null,info:"",err:"",busy:false,left:null,
  diet:null,dietPlan:null,dietMissing:false};/* diet: null until the diet plan is added, then "" until a GEN_DIETS key is chosen, dietPlan: the AI's diet */
const dietName=k=>(GEN_DIETS.find(([x])=>x===k)||[])[1]||"";

function genRead(){
  const u=S.settings.unit,lb=u==="lb";
  const wt=num(GEN.wt);
  if(wt==null||wt<(lb?66:30)||wt>(lb?660:300))return {err:"Enter your body weight in "+u+"."};
  let cm=null,htxt="";
  if(GEN.hu==="cm"){cm=num(GEN.cm);htxt=Math.round(cm)+" cm"}
  else{const f=num(GEN.ft),i=num(GEN.inch)||0;if(f!=null){cm=(f*12+i)*2.54;htxt=f+" ft "+i+" in"}}
  if(cm==null||cm<120||cm>230)return {err:"Enter a height between 120 and 230 cm (about 4 ft to 7 ft 6 in)."};
  const goal=GEN.goal.trim();
  if(goal.length<3)return {err:"Describe your goal in a few words."};
  if(GEN.diet==="")return {err:"Choose a diet type, or remove the diet plan."};
  const lifts=[];
  if(GEN.level==="lifts"){
    for(const [k,label] of GEN_LIFTS){
      const L=GEN.lifts[k]||{};const w=num(L.w),r=num(L.r)??1;
      if(w==null)continue;
      if(w<=0||w>(lb?1100:500))return {err:"Check the weight for "+label.toLowerCase()+"."};
      if(r<1||r>20||r!==Math.round(r))return {err:"Reps for "+label.toLowerCase()+" should be a whole number from 1 to 20."};
      lifts.push({name:label,weight:String(w),reps:String(r)});
    }
    if(!lifts.length)return {err:"Enter at least one best lift, or choose Beginner."};
  }
  return {wt,htxt,goal,lifts};
}
/* a picked photo, scaled down to GEN_PHOTO_MAX on the long edge as JPEG */
function readGenPhoto(file){
  return new Promise((res,rej)=>{
    if(!/^image\//.test(file.type||"image/"))return rej(new Error("type"));
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{
      const k=Math.min(1,GEN_PHOTO_MAX/Math.max(img.width,img.height));
      const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg",0.85));
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("image"))};img.src=url;
  });
}
function genError(status,body){
  if(body&&body.error)return body.error;
  if(status===401)return "Your sign-in has expired. Reload the app and try again.";
  if(status===429)return "You've reached today's limit for AI plans. Try again tomorrow.";
  return "Couldn't make a plan right now. Try again in a minute.";
}
async function genPlan(){
  if(GEN.busy)return;
  const r=genRead();
  if(r.err){GEN.err=r.err;render();return}
  if(!AI_PROXY||!auth||!auth.currentUser){GEN.err="Sign in to use AI planning.";render();return}
  const u=S.settings.unit;
  const body={weight:String(r.wt),height:r.htxt,unit:u,goal:r.goal,days:GEN.days,lifts:r.lifts,diet:GEN.diet||null,exercises:knownNames().slice(0,250),
    photo:GEN.photo?{type:"image/jpeg",data:GEN.photo.split(",")[1]}:null};
  GEN.busy=true;GEN.err="";render();window.scrollTo(0,0);
  let res,out=null;
  try{
    const token=await auth.currentUser.getIdToken();
    res=await fetch(AI_PROXY,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify(body)});
    out=await res.json().catch(()=>null);
  }catch(e){console.warn("ai plan",e);GEN.busy=false;GEN.err=navigator.onLine?"Couldn't reach the planning server. Try again in a minute.":"No connection. Connect to the internet to make an AI plan.";render();return}
  GEN.busy=false;
  if(!res.ok||!out||!out.plan||!Array.isArray(out.plan.days)||out.plan.days.length!==7){GEN.err=genError(res.status,out);render();return}
  GEN.plan={name:out.plan.name||"AI plan",days:out.plan.days.map(d=>d.t==="rest"?REST(d.focus):{t:TYPES[d.t]?d.t:"other",title:d.title,focus:d.focus||"",note:d.note||"",ex:d.ex.map(x=>X(x.n,x.s,x.lo,x.hi,x.u))})};
  GEN.ins={...out.insights,overview:out.plan.overview||""};
  GEN.dietPlan=GEN.diet&&out.diet&&Array.isArray(out.diet.meals)&&out.diet.meals.length?out.diet:null;
  GEN.dietMissing=!!GEN.diet&&!GEN.dietPlan;
  GEN.left=out.remaining??null;
  GEN.info="For "+r.wt+" "+u+", "+r.htxt+", "+GEN.days+" days a week"+(GEN.photo?", with your photo":"")+(GEN.dietPlan?", "+dietName(GEN.diet)+" diet":"")+". Goal: "+r.goal;
  S.msg="";render();window.scrollTo(0,0);
}

/* the diet plan: daily targets and the calorie split, then each meal's options with estimated macros, then tips.
   Macros are the AI's estimates; options are strings from a proxy older than the macros. */
const DIET_MACROS=[["protein","Protein","var(--pull)",4],["carbs","Carbs","var(--legs)",4],["fat","Fat","var(--core)",9]];
function dietMacroLine(o){
  if(!o.calories&&!o.protein)return "";
  return `<span class="diet-m">${o.calories?o.calories+"&nbsp;kcal · ":""}<b>${o.protein||0}&nbsp;g&nbsp;protein</b> · ${o.carbs||0}&nbsp;g&nbsp;carbs · ${o.fat||0}&nbsp;g&nbsp;fat</span>`;
}
function genDietHtml(tag){
  const d=GEN.dietPlan;if(!d)return "";
  const tiles=d.calories||d.protein?`<div class="diet-mac">`+[["calories","Calories","var(--line)"],...DIET_MACROS].map(([k,l,c])=>
    `<div style="--c:${c}"><b>${d[k]||"-"}${k!=="calories"&&d[k]?"<small>g</small>":""}</b><span>${l}</span></div>`).join("")+`</div>`:"";
  const kc=DIET_MACROS.map(([k,,,f])=>(d[k]||0)*f),tot=kc.reduce((a,b)=>a+b,0);
  const split=tot?`<div class="diet-split" aria-hidden="true">${DIET_MACROS.map(([,,c],i)=>`<i style="--c:${c};width:${100*kc[i]/tot}%"></i>`).join("")}</div>
    <p class="diet-leg">Daily targets. Calories from ${DIET_MACROS.map(([,l],i)=>`${l.toLowerCase()} ${Math.round(100*kc[i]/tot)}%`).join(", ")}. All numbers are estimates.</p>`:"";
  const opt=o=>typeof o==="string"?esc(o):esc(o.food)+dietMacroLine(o);
  return tiles+split+(d.summary?`<p>${esc(d.summary)}</p>`:"")
    +d.meals.map(m=>`<${tag}>${esc(m.name)}${m.time?` <small>${esc(m.time)}</small>`:""}</${tag}>`
      +(m.options.length>1?`<ul>${m.options.map(o=>`<li>${opt(o)}</li>`).join("")}</ul>`:`<p>${opt(m.options[0])}</p>`)).join("")
    +(d.tips&&d.tips.length?`<${tag}>Tips</${tag}><ul>${d.tips.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:"");
}

function chart(pts,useW,label){
  const W=340,H=150,pl=34,pr=10,pt=12,pb=24;
  const vals=pts.map(p=>useW?p.w:p.r);
  let mn=Math.min(...vals),mx=Math.max(...vals);if(mn===mx){mn-=1;mx+=1}
  const x=i=>pts.length===1?(pl+W-pr)/2:pl+(W-pl-pr)*i/(pts.length-1);
  const y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
  const path=pts.map((p,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(vals[i]).toFixed(1)).join(" ");
  const lab=useW?S.settings.unit:"reps";
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)} top set over time">
    <line x1="${pl}" x2="${W-pr}" y1="${H-pb}" y2="${H-pb}" stroke="var(--line)"/>
    <text x="${pl-6}" y="${y(mx)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${+mx.toFixed(1)}</text>
    <text x="${pl-6}" y="${y(mn)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${+mn.toFixed(1)}</text>
    <text x="${pl}" y="${H-6}" font-size="11" fill="var(--muted)">${fmtDate(pts[0].date)}</text>
    <text x="${W-pr}" y="${H-6}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtDate(pts[pts.length-1].date)} (top set, ${lab})</text>
    <path d="${path}" fill="none" stroke="var(--pull)" stroke-width="2.5" stroke-linejoin="round"/>
    ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(vals[i])}" r="4" fill="var(--surface)" stroke="var(--pull)" stroke-width="2"/>`).join("")}
  </svg>`;
}

/* ---------- leaderboard ----------
   Two scopes: Buddies (me, buddies who share and, for a trainer, trainees; worked out from
   their summaries) and Global (board/{uid} cards, queried per metric). Metrics: workouts,
   volume, streak, and a lift's top set this week or its best ever. */
const LS_SCOPE="infinity-scope";
function boardVal(L,m,p,lift){
  if(m==="streak")return L.streak||0;
  if(m==="lifts"){const n=(GL_LIFTS.find(x=>x[0]===lift)||GL_LIFTS[0])[1],lf=(L.lifts||[]).find(x=>x.n===n);
    return !lf?0:p==="all"?(lf.pr.w||0):weekBest(lf,mondayOf(today()))}
  if(m==="volume")return (p==="month"?L.volumeMonth:L.volumeWeek)||0;
  return p==="all"?(L.total||0):p==="month"?(L.monthWorkouts||0):(L.weekDays||[]).length;
}
/* ties go to volume, then name */
function boardRows(m,p,lift){
  m=m||BOARD.metric;p=p||BOARD.period;lift=lift||BOARD.lift;
  const rows=[{uid,p:{name:myName(),photo:myPhoto()},isMe:true,L:BOARD.meL||live(computeSummary())}];
  const seen=new Set([uid]);
  SOC.accepted.forEach(a=>{const sh=SOC.shared[a.uid];if(sh&&sh.sharing){rows.push({uid:a.uid,p:SOC.profiles[a.uid]||{},L:live(sh)});seen.add(a.uid)}});
  SOC.trainees.forEach(t=>{
    if(seen.has(t))return;
    const sh=SOC.shared[t],sum=sh&&sh.sharing?sh:BOARD.tr[t];
    if(sum){rows.push({uid:t,p:SOC.profiles[t]||{},L:live(sum),trainee:!(sh&&sh.sharing)});seen.add(t)}
  });
  /* summaries from app versions before the leaderboard have no month numbers: show them as unknown, not zero */
  rows.forEach(r=>{r.nm=r.isMe?"You":pname(r.p)||"Buddy";r.unk=p==="month"&&(m==="workouts"||m==="volume")&&r.L.monthStart==null;
    r.v=r.unk?-1:boardVal(r.L,m,p,lift);r.vol=r.unk||m==="lifts"?-1:boardVal(r.L,"volume",p==="all"?"week":p)});
  rows.sort((a,b)=>(b.v-a.v)||(b.vol-a.vol)||a.nm.localeCompare(b.nm));
  const loading=SOC.trainees.some(t=>BOARD.tr[t]===null&&!seen.has(t));
  const hidden=SOC.accepted.filter(a=>!seen.has(a.uid)&&!(SOC.trainees.includes(a.uid)&&BOARD.tr[a.uid]===null)).length;
  return {rows,hidden,loading};
}
/* how a value reads: [number, unit] */
function boardShow(m,v){
  const u=S.settings.unit;
  if(m==="volume")return [fmtNum(u==="lb"?v/0.45359:v),u];
  if(m==="lifts")return [fromKg(v),u];
  if(m==="streak")return [v,v===1?"week":"weeks"];
  return [v,v===1?"workout":"workouts"];
}
function scope(){
  if(!BOARD.scope){let v=null;try{v=localStorage.getItem(LS_SCOPE)}catch(e){}BOARD.scope=v==="global"||v==="buddies"?v:(SOC.accepted.length?"buddies":"global")}
  return BOARD.scope;
}
function setScope(v){BOARD.scope=v;try{localStorage.setItem(LS_SCOPE,v)}catch(e){}}
/* one ranking in either scope: {rows:[{uid,isMe,p,v}], loading, err}. Only people with something to show. */
function ranking(sc,m,p,lift,n){
  if(sc==="global"){const g=globalRanking(m,p,lift,n);return {rows:(g.rows||[]).filter(r=>r.v>0),loading:!!g.loading&&!g.rows,err:g.err}}
  return {rows:boardRows(m,p,lift).rows.filter(r=>r.v>0)};
}
function segH(key,cur,opts,label,cls){return `<div class="seg${cls?" "+cls:""}" role="group" aria-label="${label}">${opts.map(([v,l])=>`<button data-${key}="${v}" aria-pressed="${v===cur}">${l}</button>`).join("")}</div>`}
/* dashboard: a tile per metric showing the leader, plus the top set per lift */
function lbTile(sc,m,p,title,sub){
  const r=ranking(sc,m,p,BOARD.lift,10),top=r.rows[0];
  const mi=r.rows.findIndex(x=>x.isMe);
  const [n,l]=top?boardShow(m,top.v):["-",""];

function statusOf(a){return a.status||(a.disabled===true?"disabled":"active")}
async function accountStatus(acct,prof){

}

/* ---------- admin ----------
   Admins can list profiles, disable or enable accounts and grant or remove admin rights.
   They get no access to anyone's workout log. Disabling is enforced by the rules, not Firebase Auth. */
function admStart(){
  if(ADM.started||!ADM.is||S.mode!=="db")return;
  ADM.started=true;admCounts();admLoad();admLog();loadVids(true);
}
async function admCounts(){
  try{
    const acc=collection(fs,"accounts");
    const [u,a,d,dOld,pend]=await Promise.all([getCountFromServer(collection(fs,"profiles")),getDocs(collection(fs,"admins")),
      getDocs(query(acc,where("status","==","disabled"))),getDocs(query(acc,where("disabled","==",true))),getDocs(query(acc,where("status","==","pending")))]);
    ADM.admins=new Set(a.docs.map(x=>x.id));
    ADM.disabled=new Set([...d.docs,...dOld.docs].filter(x=>statusOf(x.data())==="disabled").map(x=>x.id));
    ADM.pending=pend.docs.map(x=>({uid:x.id,...x.data()})).sort((x,y)=>(y.requested?.seconds||0)-(x.requested?.seconds||0));
    ADM.counts={users:u.data().count};
  }catch(e){console.warn("admin counts",e);ADM.err=fbError(e,"load the counts")}
  /* trainers are whoever appears in someone's coaching list; kept apart so a failure here doesn't hide the counts */
  try{const co=await getDocs(collection(fs,"coaching"));ADM.trainers=new Set(co.docs.flatMap(x=>x.data().trainers||[]))}
  catch(e){console.warn("admin trainers",e)}
  softRender();
}
async function admLoad(){
  if(ADM.loading||ADM.done)return;
  ADM.loading=true;softRender();
  try{
    const base=[collection(fs,"profiles"),orderBy("name")];
    const snap=await getDocs(query(...base,...(ADM.last?[startAfter(ADM.last)]:[]),limit(50)));
    snap.forEach(d=>ADM.list.push({uid:d.id,...d.data()}));
    if(snap.docs.length)ADM.last=snap.docs[snap.docs.length-1];
    ADM.done=snap.docs.length<50;
  }catch(e){console.warn("admin users",e);ADM.err=fbError(e,"load users")}
  ADM.loading=false;softRender();
}

/* exercise names for the tutorials list: ready-made plans, my own plans and log, and any that already have a video */

/* save one catalogue entry: the name shown, the YouTube video, or both. key is the exercise name,
   or "" for the Add exercise row. An entry with no rename, no video and not admin-added is removed. */
async function admExercise(key,remove){
  const name=(key||$("#vNew")?.value||"").trim().slice(0,80);
  const k=slug(name);
  const li=key?document.querySelector(`li[data-ex="${CSS.escape(key)}"]`):$("#vNewRow");
  const urlIn=li&&li.querySelector("[data-vurl]"),dispIn=li&&li.querySelector("[data-vdisp]");
  const note=t=>{ADM.vmsg[k]=t;let sm=li&&li.querySelector("small");
    if(li&&!sm){sm=document.createElement("small");li.appendChild(sm)}if(sm)sm.textContent=t;else render()};
  if(!name){note("Type the exercise name.");return}
  const cur=VIDS[k];
  if(remove&&!confirm("Remove "+(cur&&cur.display||name)+" from the exercise list? Plans that use it keep it."))return;
  const id=remove?"":ytId(urlIn?urlIn.value:"");
  if(id===null){note("That doesn't look like a YouTube link or video id.");return}
  const disp=remove?name:((dispIn?dispIn.value:name).trim().slice(0,80)||name);
  const display=disp!==name?disp:"";
  const added=remove?false:key?!!(cur&&cur.added):true;
  if(!key&&!remove&&(cur||BUILTIN.some(p=>p.days.some(d=>d.ex.some(x=>slug(x.n)===k))))){note(name+" is already in the list. Edit it there.");return}
  const keep=id||display||added;
  if(!keep&&!cur){note("Nothing to save. Change the name or paste a YouTube link.");return}
  try{
    if(keep)await setDoc(doc(fs,"exercises",k),{name,...(id?{youtube:id}:{}),...(display?{display}:{}),...(added?{added:true}:{}),updatedBy:uid,updatedAt:serverTimestamp()});
    else await deleteDoc(doc(fs,"exercises",k));
  }catch(e){note(fbError(e,"save that exercise"));return}
  if(keep)VIDS[k]={id:id||"",name,display,added};else delete VIDS[k];
  ADM.vmsg[k]=remove?"Removed.":"Saved."+(display?" Shown as "+display+".":"")+(id?" Video id "+id+".":"");
  if(!key)ADM.newName="";
  const action=remove?"exremove":!key?"exadd":"exedit";
  const entry={action,target:k,name:display||name,by:uid,at:serverTimestamp()};
  ADM.log.unshift({...entry,at:null});ADM.log=ADM.log.slice(0,10);
  setDoc(doc(collection(fs,"audit")),entry).catch(e=>console.warn("audit",e));
  render();
}

async function admAct(kind,u){
  if(u===uid)return;
  const p=ADM.list.find(x=>x.uid===u)||ADM.pending.find(x=>x.uid===u)||{};const nm=pname(p)||"this user";
  const ask={approve:"Approve "+nm+(p.email?" ("+p.email+")":"")+"? They'll be able to use the app.",
    decline:"Decline "+nm+"? Their account is marked Disabled and they can't use the app. You can enable it later.",
    disable:"Disable "+nm+"? They can still sign in, but can't use the app or change any of their data until you enable them again.",
    enable:"Enable "+nm+" again?",
    makeadmin:"Make "+nm+" an admin? They'll be able to see every user, disable accounts and change who is an admin.",
    unadmin:"Remove admin rights from "+nm+"?"}[kind];
  if(!ask||!confirm(ask))return;
  const stamp={by:uid,at:serverTimestamp()};
  try{
    if(["disable","enable","approve","decline"].includes(kind)){
      const off=kind==="disable"||kind==="decline";
      await setDoc(doc(fs,"accounts",u),{status:off?"disabled":"active",disabled:off,...stamp},{merge:true});
    }
    else if(kind==="makeadmin")await setDoc(doc(fs,"admins",u),stamp);
    else await deleteDoc(doc(fs,"admins",u));
  }catch(e){say(fbError(e,"change that account"));return}
  if(kind==="disable"||kind==="decline")ADM.disabled.add(u);if(kind==="enable")ADM.disabled.delete(u);
  if(kind==="approve"||kind==="decline")ADM.pending=ADM.pending.filter(x=>x.uid!==u);
  if(kind==="makeadmin")ADM.admins.add(u);if(kind==="unadmin")ADM.admins.delete(u);
  const entry={action:kind,target:u,name:nm.slice(0,80),...stamp};
  ADM.log.unshift({...entry,at:null});ADM.log=ADM.log.slice(0,10);
  setDoc(doc(collection(fs,"audit")),entry).catch(e=>console.warn("audit",e));
  say(ADM_ACTS[kind]+" "+nm+".",true);
}

  ${ADM.err?`<p class="msg" style="color:var(--push)">${esc(ADM.err)}</p>`:""}
  <div class="panel"><h2>Users</h2>
    <input class="field" id="admQ" type="search" placeholder="Search by name" autocomplete="off" value="${esc(ADM.q)}" style="width:100%;margin-bottom:10px">
