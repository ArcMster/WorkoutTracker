    ${ADM.done?"":`<div class="row" style="margin-top:12px"><button class="btn" id="admMore" ${ADM.loading?"disabled":""}>${ADM.loading?"Loading...":"Load more"}</button></div>`}
    <p class="small muted" style="margin:12px 0 0">Search and the filters check the users loaded so far. New people who sign in appear under Requested to join and can't use the app until an admin approves them. A disabled person can still sign in, but sees only a "disabled" screen and can't change any data. Admins can't see anyone's workouts.</p>
  </div>
  <div class="panel"><h2>Exercises</h2>
    <p class="small muted" style="margin:0 0 10px">Change the name everyone sees for an exercise, for example Squat to Weighted Squat, and attach a YouTube tutorial (a watch link, youtu.be link or video id). A new name shows everywhere, in every plan and report, and logged history stays connected. Clear a link and save to remove the video.</p>
    <input class="field" id="vQ" type="search" placeholder="Filter exercises" autocomplete="off" value="${esc(ADM.vq)}" style="width:100%">
    <ul class="vids" id="vList">${vidRows()}</ul>
    <h2 style="margin-top:14px">Add an exercise</h2>
    <p class="small muted" style="margin:0 0 10px">New exercises are suggested to everyone when they build or edit a plan. A video is optional. Entries with options, like "Barbell or Dumbbell Curl", are listed above as separate exercises.</p>
    <ul class="vids"><li id="vNewRow"><input class="field" id="vNew" autocomplete="off" placeholder="Exercise name" value="${esc(ADM.newName)}" style="grid-column:1/-1" aria-label="New exercise name">
      <input class="field" data-vurl inputmode="url" autocomplete="off" placeholder="YouTube link (optional)" aria-label="YouTube link"><button class="btn small primary" data-vsave="">Add</button>
      ${ADM.newName&&ADM.vmsg[slug(ADM.newName)]?`<small>${esc(ADM.vmsg[slug(ADM.newName)])}</small>`:""}</li></ul>
  </div>
  ${ADM.log.length?`<div class="panel"><h2>Recent actions</h2><ul class="hlist">${ADM.log.map(a=>`<li><span>${esc(ADM_ACTS[a.action]||a.action)} ${esc(a.name||"a user")}</span><span class="muted">${when(a.at)}</span></li>`).join("")}</ul></div>`:""}`;
}

  S.draft=null;S.draftId=null;S.coachFor=null;return true;
}
document.addEventListener("click",async e=>{
  if(S.view==="enter"&&e.target.closest(".landing")){enterApp();return}
  {const br=e.target.closest("li[data-buddy]");if(br){S.buddyId=br.dataset.buddy;S.view="buddy";render();window.scrollTo(0,0);return}}

    delete S.plans[ds.del];writeDoc("plan_"+ds.del,null);

  if(ds.addex!=null){const d=S.draft.days[+ds.addex];d.ex.push(X("",3,8,12));render();
    const ins=document.querySelectorAll(`[data-di="${ds.addex}"][data-xf="n"]`);if(ins.length)ins[ins.length-1].focus();return}
  if(ds.rmex!=null){S.draft.days[+ds.di].ex.splice(+ds.xi,1);render();return}
  if(ds.mv){const a=S.draft.days[+ds.di].ex,i=+ds.xi,j=i+ +ds.mv;if(j>=0&&j<a.length){[a[i],a[j]]=[a[j],a[i]];render()}return}
  switch(t.id){

    case "addEmail":addByEmail($("#email").value);return;
    case "pa-yes":{const to=S.pendingAdd;S.pendingAdd=null;clearAddParam();sendRequest(to);return}

      catch(err){prompt("Copy your invite link:",inviteLink())}

    case "closeShare":closeShare();return;

  if(t.hasAttribute("data-done")){
    const tr=t.closest("tr");const ex=day().ex[+tr.dataset.ex];const k=+tr.dataset.k;

    if(e2.done)startTimer(REST_SECONDS);

});

  if(el.id==="vNew"){ADM.newName=el.value;return}

    s.unit=S.settings.unit;
  }
  const arr=s.entries[ex.n]||(s.entries[ex.n]=[]);
  const e2=arr[k]||(arr[k]={w:null,r:null,done:false});

    if(!d.title||d.title===old||d.title==="Rest")d.title=el.value==="rest"?"Rest":tinfo(el.value).label;
    if(d.t==="rest"&&el.value!=="rest"){if(d.focus===REST().focus)d.focus="";if(!d.ex.length)d.ex.push(X("",3,8,12))}

function updateBeat(tr){
  const ex=day().ex[+tr.dataset.ex];const k=+tr.dataset.k;
  const last=lastFor(ex.n);const s=cur();
  const e=(s&&s.entries[ex.n]&&s.entries[ex.n][k])||{};
  tr.querySelector(".beat").textContent=beatText(e,last&&last.sets[k],last);
}
function markLogged(){const dot=document.querySelector(`.plate[data-day="${S.day}"] .logged`);if(dot)dot.classList.add("on")}
window.addEventListener("beforeunload",e=>{if(S.view==="planEdit"&&S.draft){e.preventDefault();e.returnValue=""}});

/* ---------- rest timer ---------- */
let tEnd=0,tLen=0,tInt=null,actx=null;
/* Browsers (iOS especially) only allow sound after a tap, so the audio is switched on when a tap starts the timer */
function audioOn(){
  try{
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
    if(!actx)actx=new C();
    if(actx.state!=="running")actx.resume().catch(()=>{});
  }catch(err){}
}
/* three short buzzer beeps when rest is over */
function restBeep(){
  if(!actx)return;
  try{
    if(actx.state!=="running")actx.resume().catch(()=>{});
    const t0=actx.currentTime+0.05;
    [0,0.3,0.6].forEach((dt,i)=>{
      const o=actx.createOscillator(),g=actx.createGain(),t=t0+dt,len=i===2?0.45:0.2;
      o.type="square";o.frequency.value=i===2?1175:880;
      g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.25,t+0.02);
      g.gain.setValueAtTime(0.25,t+len-0.05);g.gain.exponentialRampToValueAtTime(0.0001,t+len);
      o.connect(g).connect(actx.destination);o.start(t);o.stop(t+len+0.02);
    });
  }catch(err){}
}
function startTimer(sec){audioOn();tLen=sec;tEnd=Date.now()+sec*1000;$("#timer").classList.add("on");clearInterval(tInt);tick();tInt=setInterval(tick,250)}
function tick(){
  const left=Math.max(0,Math.round((tEnd-Date.now())/1000));
  $("#tt").textContent=Math.floor(left/60)+":"+String(left%60).padStart(2,"0");
  $("#tb").style.width=(tLen?100*left/tLen:0)+"%";
  if(left<=0){clearInterval(tInt);$("#tt").textContent="Go";restBeep();if(navigator.vibrate)try{navigator.vibrate([200,100,200,100,400])}catch(err){}}
}
$("#tplus").onclick=()=>{audioOn();tEnd=Math.max(tEnd,Date.now())+30000;tLen+=30;clearInterval(tInt);tick();tInt=setInterval(tick,250)};
$("#tstop").onclick=()=>{clearInterval(tInt);$("#timer").classList.remove("on")};

/* ---------- install as an app ---------- */
const standalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const bar=$("#install");
function showInstall(kind){
  if(standalone()||sessionStorage.getItem("ppl-install-later"))return;
  $("#install-text").textContent=kind==="ios"
    ?"Install "+APP_NAME+": tap the Share button, then Add to Home Screen."
    :"Install "+APP_NAME+" on this device for one-tap access at the gym.";
  $("#install-go").hidden=kind==="ios";
  bar.classList.add("on");
}
function hideInstall(){bar.classList.remove("on")}
$("#install-go").onclick=async()=>{const ev=window.__bip;if(!ev)return;hideInstall();ev.prompt();try{await ev.userChoice}catch(e){}window.__bip=null};
$("#install-later").onclick=()=>{sessionStorage.setItem("ppl-install-later","1");hideInstall()};
window.addEventListener("ppl-bip",()=>showInstall("prompt"));
window.addEventListener("appinstalled",hideInstall);
if(window.__bip)showInstall("prompt");
else if(isIOS&&!standalone())showInstall("ios");
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("./sw.js").catch(()=>{});

/* ---------- boot ---------- */
const params=new URLSearchParams(location.search);
const addParam=params.get("add");
function clearAddParam(){if(params.has("add")){params.delete("add");history.replaceState(null,"",location.pathname+(params.toString()?"?"+params:""))}}
if(CONFIGURED){
  S.view="boot";render();
  onAuthStateChanged(auth,async user=>{
    stopSocial();
    uid=user?user.uid:null;
    me=user?{name:user.displayName||(user.email||"").split("@")[0],photo:user.photoURL||"",email:user.email||""}:{name:"",photo:"",email:""};
    const hadMe=restoreMe();
    if(!uid){await initStore();S.view="signin";render();if(addParam)setStatus("Sign in to accept this buddy invite.");return}
    /* A disabled account gets one calm screen: no log, no listeners, no writes. */
    const [acct,adm,prof]=await Promise.all(["accounts","admins","profiles"].map(c=>getDoc(doc(fs,c,uid)).catch(()=>null)));
    ADM.is=!!(adm&&adm.exists());
    const st=await accountStatus(acct,prof);
    if(st==="disabled"||st==="pending"){S.view=st;render();return}
    try{await initStore()}catch(e){S.mode="local"}
    if(S.mode==="db"){
      /* First sign-in on this device: wait briefly for the nickname rather than flash the Google name. */
      const prof=loadMyProfile();
      if(!hadMe)await Promise.race([prof,new Promise(r=>setTimeout(r,2500))]);
      if(me.email)setDoc(doc(fs,"emails",me.email.toLowerCase()),{uid}).catch(()=>{});
      startSocial();loadVids();if(ADM.is)admCounts();prof.then(()=>{publishNow();syncDirectory()});
      if(addParam&&addParam!==uid){S.pendingAdd=addParam;loadProfile(addParam);S.afterEnter="buddies"}
    }
    if(S.justSignedIn){S.justSignedIn=false;S.view=S.afterEnter||"dash";S.afterEnter=null}
    else S.view="enter";
    render();
  });
}else{
  initStore().then(()=>{S.view="enter";render()});
}
})();
